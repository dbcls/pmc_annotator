  vgnc:
    category: Gene
    orig_regex: ^(?:(?:VGNC|vgnc):)?(?<id>\d{1,9})$
    pattern: \b(?:(?:VGNC|vgnc):)(?P<id>\d{1,9})\b
  wormbase_gene:
    category: Gene
    orig_regex: ^(?<id>WBGene\d{8})$
    pattern: \b(?P<id>WBGene\d{8})\b
    uri: http://identifiers.org/wb/
  xenbase_gene:
    category: Gene
    orig_regex: ^(?<id>XB\-[A-Z]+\-\d+)$
    pattern: \b(?P<id>XB\-[A-Z]+\-\d+)\b
    uri: http://identifiers.org/xenbase/
  zfin_gene:
    category: Gene
    orig_regex: ^(?<id>ZDB\-[A-Z]+\-\d{6}\-\d+)$
    pattern: \b(?P<id>ZDB\-[A-Z]+\-\d{6}\-\d+)\b
    uri: http://identifiers.org/zfin/
  zfin_transcript:
    category: Transcript
    orig_regex: ^(?<id>ZDB\-[A-Z]+\-\d{6}\-\d+)$
    pattern: \b(?P<id>ZDB\-[A-Z]+\-\d{6}\-\d+)\b
