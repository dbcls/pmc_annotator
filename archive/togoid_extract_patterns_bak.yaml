  uniprot_isoform:
    category: Protein
    orig_regex: ^(?:(?<id1>[A-NR-Z][0-9](?:[A-Z][A-Z0-9][A-Z0-9][0-9]){1,2}(?:-\d+))|(?<id2>[OPQ][0-9][A-Z0-9][A-Z0-9][A-Z0-9][0-9](?:-\d+)))$
    pattern: (?:(?P<id1>[A-NR-Z][0-9](?:[A-Z][A-Z0-9][A-Z0-9][0-9]){1,2}(?:-\d+))|(?P<id2>[OPQ][0-9][A-Z0-9][A-Z0-9][A-Z0-9][0-9](?:-\d+)))
  uniprot_mnemonic:
    category: Protein
    orig_regex: ^(?<id>[A-Z0-9]+_[A-Z0-9]{0,5})$
    pattern: (?P<id>[A-Z0-9]+_[A-Z0-9]{0,5})
  uniprot_proteome:
    category: Proteome
    orig_regex: ^(?<id>UP\d{0,9})$
    pattern: (?P<id>UP\d{0,9})
  vgnc:
    category: Gene
    orig_regex: ^(?:(?:VGNC|vgnc):)?(?<id>\d{1,9})$
    pattern: (?:(?:VGNC|vgnc):)(?P<id>\d{1,9})
  wikipathways:
    category: Pathway
    orig_regex: ^(?<id>WP\d{1,5})(?:\_r\d+)?$
    pattern: (?P<id>WP\d{1,5})(?:\_r\d+)?
  wormbase_gene:
    category: Gene
    orig_regex: ^(?<id>WBGene\d{8})$
    pattern: (?P<id>WBGene\d{8})
    uri: http://identifiers.org/wb/
  xenbase_gene:
    category: Gene
    orig_regex: ^(?<id>XB\-[A-Z]+\-\d+)$
    pattern: (?P<id>XB\-[A-Z]+\-\d+)
    uri: http://identifiers.org/xenbase/
  zfin_gene:
    category: Gene
    orig_regex: ^(?<id>ZDB\-[A-Z]+\-\d{6}\-\d+)$
    pattern: (?P<id>ZDB\-[A-Z]+\-\d{6}\-\d+)
    uri: http://identifiers.org/zfin/
  zfin_transcript:
    category: Transcript
    orig_regex: ^(?<id>ZDB\-[A-Z]+\-\d{6}\-\d+)$
    pattern: (?P<id>ZDB\-[A-Z]+\-\d{6}\-\d+)
